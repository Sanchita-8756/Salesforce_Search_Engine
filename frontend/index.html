<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce MCP Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Salesforce MCP Interface</h1>
        
        <div class="section">
            <h2>SOQL Query</h2>
            <textarea id="soqlInput" placeholder="SELECT Id, Name FROM Account LIMIT 10" rows="3"></textarea>
            <button id="runSoqlBtn">Run SOQL</button>
        </div>
        
        <div class="section">
            <h2>Record Operations</h2>
            <div class="form-group">
                <label>Object:</label>
                <input type="text" id="objectName" placeholder="Account" />
            </div>
            <div class="form-group">
                <label>Record ID:</label>
                <input type="text" id="recordId" placeholder="0031234567890ABC" />
            </div>
            <div class="button-group">
                <button id="getRecordBtn">Get Record</button>
                <button id="describeBtn">Describe Object</button>
            </div>
        </div>
        
        <div class="section">
            <h2>Create/Update Record</h2>
            <textarea id="recordData" placeholder='{"Name": "Test Account", "Type": "Customer"}' rows="4"></textarea>
            <div class="button-group">
                <button id="createBtn">Create Record</button>
                <button id="updateBtn">Update Record</button>
            </div>
        </div>
        
        <div class="section">
            <h2>Results</h2>
            <div id="results"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
